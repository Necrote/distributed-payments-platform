# Active in integration tests via @ActiveProfiles("test"). The datasource comes from the
# Testcontainers @ServiceConnection, so nothing database-related belongs here.

payments:
  processor:
    # base-url comes from the in-process FakeProcessor each IT starts (@DynamicPropertySource).
    # A short read timeout so the timeout scenario costs one second, not two.
    connect-timeout: 500ms
    read-timeout: 1s
    # The same shape as production, scaled down: a read timeout leaves no room for a retry.
    total-deadline: 2s

resilience4j:
  timelimiter:
    instances:
      processor:
        timeoutDuration: 1500ms
  retry:
    instances:
      processor:
        waitDuration: 20ms
