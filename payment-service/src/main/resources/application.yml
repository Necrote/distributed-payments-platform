# payment-service - local/dev configuration.
# Nothing secret lives in this file. Every credential is an environment variable with a
# development-only default, so `docker compose up` works out of the box and production overrides
# the same keys. Phase 7 replaces these with a Kubernetes Secret.

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENTS_DB_URL:jdbc:postgresql://localhost:15432/payments}
    username: ${PAYMENTS_DB_USER:payments}
    password: ${PAYMENTS_DB_PASSWORD:payments}
    hikari:
      # Deliberately small. The HikariCP experiment in Phase 8 starts by making this the
      # bottleneck on purpose, so leave it here and change it with evidence, not by feel.
      # Rule of thumb worth being able to defend: pool size is bounded by what the DATABASE can
      # serve concurrently, not by how many threads the app has.
      maximum-pool-size: ${PAYMENTS_DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 3000      # ms to wait for a connection before failing fast
      max-lifetime: 900000          # 15 min, shorter than any proxy/DB idle timeout
      pool-name: payments-pool

  jpa:
    open-in-view: false             # off: no lazy loading inside the view layer, no hidden queries
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Uncomment while tuning queries in Phase 8 - noisy, so not on by default.
        # generate_statistics: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false      # this database has no pre-Flyway history; fail loudly if it does

  threads:
    virtual:
      # Java 21 virtual threads for the servlet container. Turn this ON deliberately in Phase 8 and
      # measure it - virtual threads help with blocking I/O, but they do NOT create database
      # capacity, and pinning on synchronized blocks is real. Measure, then decide.
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful                # finish in-flight payments before the pod dies

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true               # /actuator/health/liveness and /readiness for Kubernetes
  metrics:
    tags:
      application: payment-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------------------------
# Phase 3: the processor simulator. Timeouts belong in configuration, never hard-coded - and are
# required: ProcessorProperties has no defaults, so a missing one fails startup.
# ---------------------------------------------------------------------------------------------
payments:
  processor:
    base-url: ${PROCESSOR_BASE_URL:http://localhost:8081}
    connect-timeout: 500ms
    read-timeout: 2s                # must be < the client-facing SLO, or the caller times out first
    # An attempt only starts if the time limiter's 2500ms still fits inside this. The value comes
    # from two sums, and both matter:
    #   - Three failed connects: attempt 3 starts by 0.5 + 0.3 + 0.5 + 0.6 = 1.9s (connect timeouts
    #     plus the longest backoffs), and 1.9 + 2.5 = 4.4s. So all three attempts fit.
    #   - One read timeout: 2.0 + 2.5 = 4.5s, which does not fit. So the client gets its answer in
    #     ~2s, not the ~6.6s of three 2s attempts, each of which could be a charge we never hear of.
    # Changing the connect, read or limiter values means redoing these sums.
    total-deadline: 4400ms
  idempotency:
    key-ttl: 24h                    # how long a replayed key returns the original response

resilience4j:
  timelimiter:
    instances:
      processor:
        # One call, end to end. Changed from 2s on purpose: at 2s it would race the read timeout
        # for no benefit. Its job is what the read timeout misses, such as a processor that sends
        # headers and then stalls the body. Keep it at or above connect + read.
        timeoutDuration: 2500ms
  retry:
    instances:
      processor:
        maxAttempts: 3                    # the first call plus two retries
        waitDuration: 200ms               # then 400ms: doubled by the multiplier below
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true        # jitter: without it, retries synchronise into a storm
        randomizedWaitFactor: 0.5         # each wait lands within +/-50%
        # Our own types, not IOException and TimeoutException as first drafted: ProcessorClient
        # translates those, so they would never match and nothing would ever retry. Everything
        # unlisted is final: declines are not exceptions at all, a 4xx would get the same answer,
        # and a 5xx is left for the circuit breaker (Day 16).
        retryExceptions:
          - com.vivekpatel.payments.processor.ProcessorException$ConnectFailed
          - com.vivekpatel.payments.processor.ProcessorException$TimedOut
          - com.vivekpatel.payments.processor.ProcessorException$ConnectionBroken

# Phase 3 (Day 16-17). Left commented so this file does not claim resilience it has not
