name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B -ntp"   # batch mode, no transfer progress - readable logs

jobs:
  # -------------------------------------------------------------------------------------------
  # payment-service is the only service that exists in Phase 1, so it is the only job that runs.
  # The matrix below is deliberately a matrix of ONE: adding processor-simulator in Phase 3 and
  # ledger-service in Phase 4 is a one-line change, and until then CI does not pretend to build
  # things that are empty.
  # -------------------------------------------------------------------------------------------
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-service
          # - processor-simulator   # enable in Phase 3 (Day 13)
          # - ledger-service        # enable in Phase 4 (Day 25)

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` rather than `test`: it runs surefire (unit tests) AND failsafe (*IT integration
      # tests). The GitHub-hosted ubuntu runners ship Docker, so Testcontainers works here without
      # any extra service containers - the tests start exactly the PostgreSQL they need and throw
      # it away afterwards. That is the whole reason for choosing Testcontainers over a
      # `services:` block: the same command works on a laptop and in CI.
      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn ${{ env.MAVEN_ARGS }} verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------------------------
  # Mutation testing. Enable in Phase 2 (Day 11), after you have MEASURED a score and strengthened
  # the weak tests - then set the threshold in payment-service/pom.xml just below what you reached
  # and let it fail the build. A threshold invented before the first measurement is theatre.
  #
  # Prove the gate works before you trust it: weaken an assertion on a branch and watch CI go red.
  # -------------------------------------------------------------------------------------------
  # mutation-testing:
  #   name: PIT mutation score
  #   runs-on: ubuntu-latest
  #   needs: build
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with: { distribution: temurin, java-version: "21", cache: maven }
  #     - name: Mutation coverage
  #       working-directory: payment-service
  #       run: mvn ${{ env.MAVEN_ARGS }} org.pitest:pitest-maven:mutationCoverage
  #     - uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: pit-report
  #         path: payment-service/target/pit-reports/

  # -------------------------------------------------------------------------------------------
  # Phase 8 (Day 60): a Gatling smoke run on every push, with a low, MEASURED assertion so it
  # catches a performance regression rather than decorating the pipeline. Do not add this until
  # docs/performance/baseline.md contains real numbers to regress against.
